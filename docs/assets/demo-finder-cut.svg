<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="MacToolbox Finder ⌘X 剪切与 ⌘V 移动演示">
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
.mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
.fc-s1 { opacity: 1; animation: fc-p1 8s ease-in-out infinite; }
.fc-s2 { opacity: 0; animation: fc-p2 8s ease-in-out infinite; }
.fc-s3 { opacity: 0; animation: fc-p3 8s ease-in-out infinite; }
.fc-s4 { opacity: 0; animation: fc-p4 8s ease-in-out infinite; }
.fc-src-view { opacity: 1; animation: fc-src 8s ease-in-out infinite; }
.fc-dst-view { opacity: 0; animation: fc-dst 8s ease-in-out infinite; }
.fc-cut-rows { opacity: 1; animation: fc-cut-dim 8s ease-in-out infinite; }
.fc-cut-badge { opacity: 0; animation: fc-p2 8s ease-in-out infinite; }
.fc-sb-dl { opacity: 1; animation: fc-src 8s ease-in-out infinite; }
.fc-sb-ar { opacity: 0; animation: fc-dst 8s ease-in-out infinite; }
.fc-hud-x { opacity: 0; animation: fc-hudx 8s ease-in-out infinite; }
.fc-hud-v { opacity: 0; animation: fc-hudv 8s ease-in-out infinite; }
.fc-moved { opacity: 0; animation: fc-moved 8s ease-in-out infinite; }
.fc-cursor { animation: fc-cur 8s ease-in-out infinite; }

@keyframes fc-p1 { 0%, 21% { opacity: 1; } 24%, 97% { opacity: 0; } 100% { opacity: 1; } }
@keyframes fc-p2 { 0%, 20% { opacity: 0; } 24%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes fc-p3 { 0%, 46% { opacity: 0; } 50%, 71% { opacity: 1; } 74%, 100% { opacity: 0; } }
@keyframes fc-p4 { 0%, 70% { opacity: 0; } 74%, 97% { opacity: 1; } 100% { opacity: 0; } }

@keyframes fc-src { 0%, 48% { opacity: 1; } 51%, 98% { opacity: 0; } 100% { opacity: 1; } }
@keyframes fc-dst { 0%, 48% { opacity: 0; } 51%, 97% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fc-cut-dim { 0%, 22% { opacity: 1; } 26%, 48% { opacity: 0.44; } 52%, 100% { opacity: 1; } }

@keyframes fc-hudx {
  0%, 21% { opacity: 0; transform: translate(0px, 10px); }
  26%, 46% { opacity: 1; transform: translate(0px, 0px); }
  50%, 100% { opacity: 0; transform: translate(0px, -4px); }
}
@keyframes fc-hudv {
  0%, 71% { opacity: 0; transform: translate(0px, 10px); }
  76%, 96% { opacity: 1; transform: translate(0px, 0px); }
  100% { opacity: 0; transform: translate(0px, -4px); }
}
@keyframes fc-moved {
  0%, 72% { opacity: 0; transform: translate(-24px, 0px); }
  79%, 96% { opacity: 1; transform: translate(0px, 0px); }
  100% { opacity: 0; transform: translate(0px, 0px); }
}
@keyframes fc-cur {
  0%, 20% { transform: translate(398px, 152px); }
  26%, 44% { transform: translate(398px, 152px); }
  50%, 70% { transform: translate(148px, 214px); }
  76%, 95% { transform: translate(404px, 194px); }
  100% { transform: translate(398px, 152px); }
}
</style>
<defs>
  <clipPath id="fc-frame">
    <rect x="0" y="0" width="880" height="500" rx="18"/>
  </clipPath>
  <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1222"/>
    <stop offset="50%" stop-color="#132645"/>
    <stop offset="100%" stop-color="#09111e"/>
  </linearGradient>
  <radialGradient id="fc-glow-a" cx="0.22" cy="0.18" r="0.55">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fc-glow-b" cx="0.82" cy="0.84" r="0.55">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <filter id="fc-shadow" x="-12%" y="-12%" width="124%" height="130%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.48"/>
  </filter>
  <filter id="fc-soft-shadow" x="-15%" y="-15%" width="130%" height="135%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.32"/>
  </filter>
</defs>
